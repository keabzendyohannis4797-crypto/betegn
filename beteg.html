<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B1C2E">
<title>ቤተኛ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;600&family=Noto+Sans+Ethiopic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#EEF0F5; --surface:#FFFFFF; --ink:#1B1C2E; --muted:#686A80; --line:#DFE2EB;
--accent:#D9482B; --accent-ink:#FFFFFF; --teal:#12877B; --danger:#C62F3E;
--mine:#232540; --mine-ink:#F4F5FA; --theirs:#FFFFFF; --whoL:38%;
--shadow:0 10px 34px rgba(27,28,46,.10);
--f-display:'Bricolage Grotesque','Noto Sans Ethiopic',sans-serif;
--f-body:'DM Sans','Noto Sans Ethiopic',sans-serif;
}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
--bg:#0F1018; --surface:#181A27; --ink:#ECEDF5; --muted:#9496AC; --line:#272A3B;
--accent:#FF6A47; --accent-ink:#1B0D08; --teal:#2FB5A6; --danger:#FF6B78;
--mine:#33376B; --mine-ink:#F4F5FA; --theirs:#1F2233; --whoL:72%;
--shadow:0 10px 34px rgba(0,0,0,.45); color-scheme:dark;
}
}
:root[data-theme="dark"]{
--bg:#0F1018; --surface:#181A27; --ink:#ECEDF5; --muted:#9496AC; --line:#272A3B;
--accent:#FF6A47; --accent-ink:#1B0D08; --teal:#2FB5A6; --danger:#FF6B78;
--mine:#33376B; --mine-ink:#F4F5FA; --theirs:#1F2233; --whoL:72%;
--shadow:0 10px 34px rgba(0,0,0,.45); color-scheme:dark;
}
html{box-sizing:border-box}
html,body{height:100%}
*,*::before,*::after{box-sizing:inherit}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto;position:relative;background:var(--bg);overflow:hidden;border-inline:1px solid var(--line)}
.screen{height:100%;display:flex;flex-direction:column;min-height:0}
.ic{display:inline-flex;flex:none}
/* auth */
.tilet{height:10px;flex:none;background:repeating-linear-gradient(90deg,var(--accent) 0 14px,var(--ink) 14px 18px,var(--teal) 18px 32px,var(--ink) 32px 36px)}
.auth{flex:1;overflow-y:auto;padding:36px 20px 28px;display:flex;flex-direction:column;gap:26px}
.brand{font-family:var(--f-display);font-weight:700;font-size:76px;line-height:1;letter-spacing:-.02em;margin:0}
.tag-line{color:var(--muted);margin:10px 0 0;max-width:30ch;text-wrap:balance}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{padding:10px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
form.stack{display:flex;flex-direction:column;gap:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
label.f input{font-size:16px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
label.f input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.primary{background:var(--accent);color:var(--accent-ink);font-weight:700;padding:14px;border-radius:14px;font-size:16px}
.primary:active{transform:translateY(1px)}
.err{margin:0;color:var(--danger);font-size:14px}
.fine{color:var(--muted);font-size:13px;margin:0}
/* top bars */
.bar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.bar h1{font-family:var(--f-display);font-size:26px;letter-spacing:-.01em;margin:0;flex:1}
.ibtn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.ibtn:hover{background:var(--bg)}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none;font-family:var(--f-display)}
/* list */
.list{flex:1;overflow-y:auto;padding:8px 8px 20px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 10px;border-radius:16px}
.row:hover{background:var(--surface)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.row-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-time{font-size:12px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.row-sub{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;background:var(--danger);color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;margin-right:6px}
.demo-note{margin:6px 10px 10px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px dashed var(--line);color:var(--muted);font-size:13px}
/* chat */
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.chat-title{flex:1;min-width:0;display:flex;flex-direction:column}
.chat-title b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-title span{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--teal);background:color-mix(in srgb,var(--teal) 14%,transparent);padding:3px 9px;border-radius:99px;flex:none}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.sys,.empty{align-self:center;text-align:center;color:var(--muted);font-size:13px;margin:8px 0;max-width:34ch}
.msg{max-width:82%;min-width:0;padding:8px 12px 6px;display:flex;flex-direction:column;gap:3px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--mine);color:var(--mine-ink);border-radius:18px 18px 4px 18px}
.msg.them{align-self:flex-start;background:var(--theirs);border:1px solid var(--line);border-radius:18px 18px 18px 4px}
.who{font-size:12px;font-weight:700}
.txt{margin:0;white-space:pre-wrap}
.photo{display:block;width:100%;max-width:260px;border-radius:12px;cursor:zoom-in;margin-top:2px}
.msg audio{width:230px;max-width:100%;height:40px}
.meta{align-self:flex-end;font-size:11px;opacity:.65;display:inline-flex;gap:4px;align-items:center;font-variant-numeric:tabular-nums}
.composer{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface);border-top:1px solid var(--line);flex:none}
.composer input[type=text]{flex:1;min-width:0;font-size:16px;padding:11px 16px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.composer input[type=text]:focus{outline:none;border-color:var(--accent)}
.round{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.round.go{background:var(--accent);color:var(--accent-ink)}
.round.soft{background:var(--bg);color:var(--ink)}
.rec{display:none;flex:1;align-items:center;gap:10px;color:var(--danger);font-weight:600}
.rec i{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.composer.recording .rec{display:flex}
.composer.recording input[type=text],.composer.recording #photoBtn,.composer.recording #sendBtn{display:none}
.composer.recording #micBtn{background:var(--danger);color:#fff}
.blocked-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--surface);border-top:1px solid var(--line);flex:none;color:var(--muted);font-size:14px}
.blocked-bar button{color:var(--accent);font-weight:700}
/* settings */
.pad{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.profile{display:flex;align-items:center;gap:14px}
.profile b{display:block;font-size:17px}
.profile span{color:var(--muted);font-size:13px}
h2.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 -10px 4px}
.line{display:flex;align-items:center;gap:12px}
.line .grow{flex:1;min-width:0}
.small-btn{padding:7px 14px;border-radius:99px;border:1px solid var(--line);font-weight:600;font-size:13px}
.danger-btn{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:var(--danger);font-weight:600;text-align:left}
.plain-btn{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-weight:600;text-align:left}
/* sheet, lightbox, toast */
.back{position:absolute;inset:0;background:rgba(10,10,20,.5);z-index:20;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--surface);border-radius:24px 24px 0 0;padding:18px 16px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.sheet h3{margin:0 4px 2px;font-family:var(--f-display);font-size:20px}
.sheet .note{margin:0 4px 6px;color:var(--muted);font-size:14px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;text-align:left;width:100%;font-weight:500}
.opt:hover{background:var(--bg)}
.opt span{flex:1;min-width:0}
.opt small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.opt.danger{color:var(--danger)}
.opt.on{color:var(--teal);font-weight:700}
.opt.cancel{justify-content:center;background:var(--bg);font-weight:600;margin-top:4px}
.opt.cancel span{flex:none}
.lightbox{position:absolute;inset:0;z-index:30;background:rgba(5,5,12,.92);display:flex;align-items:center;justify-content:center;padding:16px}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:40;max-width:90%;text-align:center}
@media (prefers-reduced-motion:reduce){.sheet,.rec i{animation:none}}
:root{color-scheme:light}
body{margin:0}
#app{height:100%;height:100dvh}
.searchwrap{padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.search{width:100%;font-size:16px;padding:11px 16px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.search:focus{outline:none;border-color:var(--accent)}
.bar{padding-top:calc(12px + env(safe-area-inset-top,0px))}
.chat-head{padding-top:calc(10px + env(safe-area-inset-top,0px))}
.composer,.blocked-bar{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.auth{padding-top:calc(36px + env(safe-area-inset-top,0px))}
.primary:disabled{opacity:.6}
</style>
</head>
<body>
<div id="app">
<section class="screen" id="setupScreen" hidden>
<div class="tilet"></div>
<div class="auth">
<h1 class="brand">ቤተኛ</h1>
<p class="tag-line">Firebase ገና አልተገናኘም። የ firebaseConfig እሴቶችን በ index.html ውስጥ ያስገቡ።</p>
</div>
</section>
<section class="screen" id="authScreen" hidden>
<div class="tilet"></div>
<div class="auth">
<header>
<h1 class="brand">ቤተኛ</h1>
<p class="tag-line">ከማህበረሰብህ ጋር በጽሑፍ፣ በፎቶ እና በድምፅ ተገናኝ።</p>
</header>

<label class="f">የይለፍ ቃል<input id="fPass" type="password" autocomplete="current-password"></label>
<p class="err" id="authErr" role="alert" hidden></p>
<button class="primary" id="authBtn">ግባ</button>
</form>
<p class="fine">የተጠቃሚ ስምህ እንግሊዝኛ ፊደል እና ቁጥር ብቻ መያዝ አለበት። የይለፍ ቃል ከረሳህ ማስመለስ አይቻልም፤ ስለዚህ አስታውሰው።</p>
</div>
</section>
<section class="screen" id="listScreen" hidden>
<div class="tilet"></div>
<div class="bar">
<h1>ቤተኛ</h1>
<button class="ibtn" id="newChat" aria-label="አዲስ ውይይት"></button>
<button class="ibtn" id="openSettings" aria-label="ቅንብሮች"></button>
</div>
<div class="list" id="convList"></div>
</section>
<section class="screen" id="peopleScreen" hidden>
<div class="bar">
<button class="ibtn" id="peopleBack" aria-label="ተመለስ"></button>
<h1>ሰዎች</h1>
</div>
<div class="searchwrap"><input type="search" id="peopleQ" class="search" placeholder="በስም ወይም በተጠቃሚ ስም ፈልግ" aria-label="ፈልግ"></div>
<div class="list" id="peopleList"></div>
</section>
<section class="screen" id="chatScreen" hidden>
<div class="chat-head">
<button class="ibtn" id="chatBack" aria-label="ተመለስ"></button>
<span id="chatAv"></span>
<div class="chat-title"><b id="chatName"></b><span id="chatSub"></span></div>
<span class="chip" id="timerChip" hidden></span>
<button class="ibtn" id="chatMenu" aria-label="ተጨማሪ"></button>
</div>
<div class="msgs" id="msgs"></div>
<div class="blocked-bar" id="blockedBar" hidden>
<span>ይህ ሰው ታግዷል። መልዕክት መላክ አይቻልም።</span>
<button id="unblockHere">አታግድ</button>
</div>
<form class="composer" id="composer" autocomplete="off">
<button type="button" class="round soft" id="photoBtn" aria-label="ፎቶ ላክ"></button>
<input type="text" id="txt" placeholder="መልዕክት ጻፍ" aria-label="መልዕክት" maxlength="2000">
<div class="rec"><i></i><span id="recTime">0:00</span><span>እየቀረጸ ነው፤ ለመላክ ቁም ይንኩ</span></div>
<button type="submit" class="round go" id="sendBtn" aria-label="ላክ" hidden></button>
<button type="button" class="round go" id="micBtn" aria-label="የድምፅ መልዕክት"></button>
</form>
</section>
<section class="screen" id="setScreen" hidden>
<div class="bar">
<button class="ibtn" id="setBack" aria-label="ተመለስ"></button>
<h1>ቅንብሮች</h1>
</div>
<div class="pad" id="setBody"></div>
</section>
<div class="toast" id="toast" hidden></div>
</div>
<input type="file" id="photoIn" accept="image/*" hidden>
<input type="file" id="audioIn" accept="audio/*" capture hidden>

function errH(e){

function authError(msg){ const e = $('#authErr'); e.textContent = msg; e.hidden = false; }
function authMsg(e){
const c = e && e.code;
if (c === 'auth/email-already-in-use') return 'ይህ የተጠቃሚ ስም ተይዟል። ሌላ ምረጥ።';
if (c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/user-not-found') return 'የተጠቃሚ ስሙ ወይም የይለፍ ቃሉ ትክክል አይደለም።';
if (c === 'auth/weak-password') return 'የይለፍ ቃል ቢያንስ 6 ቁምፊ መሆን አለበት።';
if (c === 'auth/too-many-requests') return 'ብዙ ሙከራ ተደርጓል። ጥቂት ቆይተህ ሞክር።';
if (c === 'auth/network-request-failed') return 'ኢንተርኔት የለም። ግንኙነትህን አረጋግጥ።';

}

async function startSession(user){

const uname = (user.email || '').replace(EMAIL, '');
const uref = doc(db, 'users', me);
try {
const s = await getDoc(uref);
if (!s.exists()) await setDoc(uref, {name: pendingName || uname, username: uname, createdAt: serverTimestamp(), cleared: {}});
} catch (e) { errH(e); }
pendingName = null;
unsubs.push(onSnapshot(uref, (s) => { const d = s.data() || {}; meName = d.name || uname; cleared = d.cleared || {}; rerender(); }, errH));
unsubs.push(onSnapshot(collection(uref, 'blocked'), (s) => { blocked = new Set(s.docs.map(d => d.id)); rerender(); }, errH));

/* photo */
function shrink(file){
return new Promise((res, rej) => {
const url = URL.createObjectURL(file), im = new Image();
im.onload = () => {
URL.revokeObjectURL(url);
for (const [max, q] of [[800, .62], [640, .5], [480, .45]]){
const r = Math.min(1, max / Math.max(im.width, im.height));
const cv = document.createElement('canvas');
cv.width = Math.round(im.width * r); cv.height = Math.round(im.height * r);
cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
const out = cv.toDataURL('image/jpeg', q);
if (out.length < 330000) return res(out);
}
rej();
};
im.onerror = () => { URL.revokeObjectURL(url); rej(); };
im.src = url;
});
}

try { send('photo', {src:await shrink(f)}, ''); } catch (e) { toast('ፎቶውን ማዘጋጀት አልተቻለም።'); }

/* voice */
function sendAudio(blob){
const fr = new FileReader();
fr.onload = () => {
if (fr.result.length > 700000) return toast('የድምፅ መልዕክቱ በጣም ረጅም ነው። አጠር አድርገህ ሞክር።');
send('audio', {src:fr.result}, '');
};
fr.readAsDataURL(blob);
}
function setRecUI(on){ $('#composer').classList.toggle('recording', on); fill('#micBtn', on ? 'stop' : 'mic'); }
$('#micBtn').addEventListener('click', async () => {
if (rec){ rec.mr.stop(); return; }
if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder)){ $('#audioIn').click(); return; }
let stream;
try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
catch (e) { toast('ማይክሮፎን አልተፈቀደም። የድምፅ ፋይል ምረጥ።'); $('#audioIn').click(); return; }
const mr = new MediaRecorder(stream, {audioBitsPerSecond:24000}), chunks = [], start = Date.now();
mr.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
mr.onstop = () => {
stream.getTracks().forEach(t => t.stop());
clearInterval(rec.iv); rec = null; setRecUI(false);
sendAudio(new Blob(chunks, {type:mr.mimeType || 'audio/webm'}));
};
rec = {mr, iv:setInterval(() => {
const s = Math.floor((Date.now() - start) / 1000);
$('#recTime').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
if (s >= 90) mr.stop();
}, 250)};
$('#recTime').textContent = '0:00'; mr.start(); setRecUI(true);
});
$('#audioIn').addEventListener('change', (ev) => { const f = ev.target.files[0]; ev.target.value = ''; if (f) sendAudio(f); });

if (blocked.has(o)) items.push({label:'አታግድ', icon:'block', fn:() => setBlocked(o, false)});
else items.push({label:nameOf(o) + ' ን አግድ', icon:'block', danger:true, fn:() => {
sheet(nameOf(o) + ' ይታገድ?', [{label:'አዎ፣ አግድ', icon:'block', danger:true, fn:() => setBlocked(o, true)}], 'መልዕክቱን አታይም፣ እሱም ወደ አንተ መልዕክት መላክ አይችልም። በማንኛውም ጊዜ መፍታት ትችላለህ።');
}});
}
sheet(title, items);
});
$('#unblockHere').addEventListener('click', () => setBlocked(otherOf(cur), false));
$('#chatBack').addEventListener('click', () => { if (unsubMsgs){ unsubMsgs(); unsubMsgs = null; } cur = null; msgs = []; renderList(); show('listScreen'); });
function renderSettings(){
const box = $('#setBody'), un = (people[me] && people[me].username) || '';
box.replaceChildren(
h('div', {class:'card'}, h('div', {class:'profile'}, avatar(meName, hueOf(me), 54), h('div', {}, h('b', {}, meName), h('span', {}, '@' + un)))),
h('h2', {class:'sec'}, 'የታገዱ ሰዎች'),
h('div', {class:'card'}, blocked.size
? [...blocked].map(u => h('div', {class:'line'}, avatar(nameOf(u), hueOf(u), 38), h('span', {class:'grow'}, nameOf(u)),
h('button', {class:'small-btn', on:{click:() => setBlocked(u, false)}}, 'አታግድ')))
: h('p', {class:'fine'}, 'ማንም አልታገደም። በግል ውይይት ውስጥ ከ ⋯ ምናሌ ማገድ ትችላለህ።')),
h('h2', {class:'sec'}, 'ታሪክ'),
h('button', {class:'danger-btn', on:{click:() => sheet('ሁሉም ታሪክ ይጥፋ?', [{label:'አዎ፣ ሁሉንም አጥፋ', icon:'trash', danger:true, fn:clearAll}], 'በሁሉም ውይይቶች ያለው ታሪክ ከአንተ ስልክ ይጠፋል። ሌሎች ሰዎች አሁንም ያዩታል።')}}, icon('trash', 20), 'ሁሉንም ውይይት አጥፋ'),
h('button', {class:'plain-btn', on:{click:() => signOut(auth)}}, icon('out', 20), 'ውጣ'));
}
$('#openSettings').addEventListener('click', () => { renderSettings(); show('setScreen'); });
$('#setBack').addEventListener('click', () => { renderList(); show('listScreen'); });
fill('#newChat', 'plus', 22); fill('#openSettings', 'user', 22);
fill('#peopleBack', 'back', 24); fill('#chatBack', 'back', 24); fill('#chatMenu', 'more', 22); fill('#setBack', 'back', 24);
fill('#photoBtn', 'img', 22); fill('#sendBtn', 'send', 20); fill('#micBtn', 'mic', 22);
setMode('in');
if (/^__/.test(firebaseConfig.apiKey)){
show('setupScreen');
} else {
const app = initializeApp(firebaseConfig);
auth = getAuth(app); db = getFirestore(app);
show('authScreen');
onAuthStateChanged(auth, (user) => { if (user) startSession(user); else if (me) endSession(); else show('authScreen'); });
}
</script>
